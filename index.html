<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>MOSA | Mengo Old Students Association</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&family=Playfair+Display:wght@400;500;600;700;800;900&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" />
  <style>
    :root {
      --mosa-red: #CC0000;
      --mosa-gold: #FFD700;
      --mosa-black: #111111;
      --mosa-text: #1f2937;
      --mosa-muted: #6b7280;
      --mosa-gray: #f3f4f6;
      --shadow-sm: 0 1px 2px rgba(0,0,0,0.05);
      --shadow-md: 0 4px 6px rgba(0,0,0,0.07);
      --shadow-lg: 0 10px 25px rgba(0,0,0,0.1);
    }
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    html { scroll-behavior: smooth; }
    body {
      font-family: 'Inter', sans-serif;
      color: var(--mosa-text);
      background: #f9fafb;
      -webkit-font-smoothing: antialiased;
    }
    a { color: inherit; text-decoration: none; }
    img { max-width: 100%; display: block; }

    .container { max-width: 1280px; margin: 0 auto; padding: 0 1.5rem; }
    .section { padding: 5rem 0; }
    .bg-gray { background: var(--mosa-gray); }

    .btn {
      display: inline-flex; align-items: center; justify-content: center;
      font-weight: 700; border: none; cursor: pointer; transition: all 0.2s;
      border-radius: 8px; font-size: 0.9rem; padding: 0.65rem 1.4rem;
      line-height: 1; white-space: nowrap;
    }
    .btn-sm { padding: 0.45rem 1rem; font-size: 0.8rem; }
    .btn-lg { padding: 0.85rem 2rem; font-size: 1rem; }
    .btn-primary { background: var(--mosa-red); color: #fff; }
    .btn-primary:hover { background: #a00000; }
    .btn-gold { background: var(--mosa-gold); color: var(--mosa-black); }
    .btn-gold:hover { background: #e6c200; }
    .btn-outline { background: transparent; border: 2px solid rgba(255,255,255,0.3); color: #fff; }
    .btn-outline:hover { background: rgba(255,255,255,0.1); }
    .btn-outline-dark { background: transparent; border: 2px solid #d1d5db; color: var(--mosa-text); }
    .btn-outline-dark:hover { border-color: var(--mosa-black); color: var(--mosa-black); }

    .card {
      background: #fff; border-radius: 12px; border: 1px solid #e5e7eb;
      box-shadow: var(--shadow-sm); transition: all 0.25s;
    }
    .card:hover { box-shadow: var(--shadow-md); }

    .badge {
      display: inline-block; font-size: 0.7rem; font-weight: 700;
      text-transform: uppercase; letter-spacing: 0.05em;
      padding: 0.25rem 0.7rem; border-radius: 20px;
    }
    .badge-red { background: #fef2f2; color: var(--mosa-red); }
    .badge-gold { background: #fefce8; color: #a16207; }
    .badge-blue { background: #eff6ff; color: #1d4ed8; }
    .badge-green { background: #f0fdf4; color: #15803d; }
    .badge-gray { background: #f3f4f6; color: var(--mosa-muted); }

    .form-group { margin-bottom: 1.25rem; }
    .form-label { display: block; font-size: 0.85rem; font-weight: 600; margin-bottom: 0.4rem; }
    .form-input, .form-select {
      padding: 0.65rem 1rem; border: 1px solid #d1d5db; border-radius: 8px;
      font-size: 0.9rem; font-family: inherit; background: #fff;
      transition: border-color 0.2s, box-shadow 0.2s; outline: none;
      color: var(--mosa-text);
    }
    .form-input:focus, .form-select:focus { border-color: var(--mosa-red); box-shadow: 0 0 0 3px rgba(204,0,0,0.1); }

    .eyebrow {
      font-size: 0.75rem; font-weight: 700; text-transform: uppercase;
      letter-spacing: 0.12em; color: var(--mosa-red);
    }
    .section-title {
      font-family: 'Playfair Display', serif;
      font-size: clamp(1.6rem, 3.5vw, 2.4rem); font-weight: 900;
      color: var(--mosa-black);
    }
    .subtitle { font-size: 1rem; color: var(--mosa-muted); line-height: 1.7; }
    .divider { height: 3px; width: 3rem; border-radius: 2px; margin: 1rem 0; }
    .divider-red { background: var(--mosa-red); }
    .divider-gold { background: var(--mosa-gold); }
    .divider-center { margin-left: auto; margin-right: auto; }

    .grid-3 { display: grid; grid-template-columns: repeat(auto-fill, minmax(300px, 1fr)); gap: 1.5rem; }
    .grid-4 { display: grid; grid-template-columns: repeat(auto-fill, minmax(240px, 1fr)); gap: 1.5rem; }

    .pagination { display: flex; gap: 0.25rem; }
    .page-btn {
      width: 2.4rem; height: 2.4rem; border: 1px solid #d1d5db;
      background: #fff; border-radius: 6px; cursor: pointer;
      font-weight: 600; font-size: 0.85rem; color: var(--mosa-text);
      display: flex; align-items: center; justify-content: center;
      transition: all 0.15s;
    }
    .page-btn:hover { background: #f3f4f6; }
    .page-btn.active { background: var(--mosa-red); color: #fff; border-color: var(--mosa-red); }

    .fade-in-up { animation: fadeInUp 0.6s ease-out; }
    @keyframes fadeInUp {
      from { opacity: 0; transform: translateY(20px); }
      to { opacity: 1; transform: translateY(0); }
    }
  </style>
</head>
<body>
  <div id="root"></div>
  <script type="module" src="/src/main.jsx"></script>
</body>
</html>
